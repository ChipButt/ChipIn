name: Repair Hospitality transparent artwork

on:
  push:
    paths:
      - '.github/workflows/fix-hospitality-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-transparent-png:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Chroma-key green, trim visible artwork and verify true alpha PNG
        run: |
          python - <<'PY'
          from PIL import Image

          source = 'hospitality_&_events.png'
          output = 'hospitality_events_transparent.png'

          image = Image.open(source).convert('RGBA')
          pixels = list(image.getdata())
          keyed = []

          for r, g, b, a in pixels:
              dominance = g - max(r, b)
              if g > 145 and dominance > 35:
                  # Feather the chroma key so anti-aliased edges stay smooth.
                  strength = max(0.0, min(1.0, (dominance - 35) / 150.0))
                  new_a = int(round(a * (1.0 - strength)))
                  if new_a <= 2:
                      keyed.append((0, 0, 0, 0))
                  else:
                      # Remove green spill from partially transparent edge pixels.
                      clean_g = min(g, max(r, b) + 16)
                      keyed.append((r, clean_g, b, new_a))
              else:
                  keyed.append((r, g, b, a))

          image.putdata(keyed)

          # Determine the crop from pixels that are genuinely visible. Very faint
          # alpha remnants from the keyed background must not define the canvas.
          alpha = image.getchannel('A')
          visible_mask = alpha.point(lambda value: 255 if value >= 32 else 0)
          bbox = visible_mask.getbbox()
          if not bbox:
              raise RuntimeError('Chroma key removed the entire image.')

          left, top, right, bottom = bbox
          pad = 18
          left = max(0, left - pad)
          top = max(0, top - pad)
          right = min(image.width, right + pad)
          bottom = min(image.height, bottom + pad)
          image = image.crop((left, top, right, bottom))
          image.save(output, 'PNG', optimize=True, compress_level=9)

          # Verification required for the production asset.
          check = Image.open(output)
          if check.mode != 'RGBA':
              raise RuntimeError(f'Expected RGBA PNG, got {check.mode}.')

          alpha = check.getchannel('A')
          lo, hi = alpha.getextrema()
          transparent_pixels = sum(1 for value in alpha.getdata() if value == 0)
          if lo != 0 or hi != 255 or transparent_pixels == 0:
              raise RuntimeError('Output does not contain a genuine alpha channel with fully transparent pixels.')

          remaining_green = 0
          for r, g, b, a in check.getdata():
              if a > 8 and g > 170 and g - max(r, b) > 70:
                  remaining_green += 1
          if remaining_green > 25:
              raise RuntimeError(f'Green spill verification failed: {remaining_green} pixels remain.')

          # Report the meaningful visible bounds too, so the service-title scale
          # can be checked against the other artwork rather than the PNG canvas.
          meaningful = alpha.point(lambda value: 255 if value >= 32 else 0).getbbox()
          print(
              f'Created {output}: {check.size[0]}x{check.size[1]}, mode={check.mode}, '
              f'meaningful_bbox={meaningful}, transparent_pixels={transparent_pixels}, '
              f'remaining_green={remaining_green}'
          )
          PY

      - name: Commit repaired asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hospitality_events_transparent.png
          if git diff --cached --quiet; then
            echo "No asset change required."
          else
            git commit -m "Normalize Hospitality title artwork size"
            git push
          fi
