<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a2f57" />
  <title>Chip In HQ</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand-wrap">
        <img id="brandLogo" class="brand-logo" alt="Chip In" />
        <div class="brand-sub">HQ</div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn" id="backupQuickBtn">Backup data</button>
        <div class="save-state" id="saveState">Saved on this device</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Your business admin, in one place.</p>
        </div>
        <div class="top-actions" id="topActions"></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" data-close-modal aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <template id="emptyTemplate">
    <div class="empty-state">
      <div class="empty-icon">＋</div>
      <h3>Nothing here yet</h3>
      <p></p>
    </div>
  </template>

  <script src="app1.js"></script>
  <script src="app2_1.js"></script>
  <script src="app2_2.js"></script>
  <script src="app2_3.js"></script>
  <script src="app2_4.js"></script>
  <script src="app3.js"></script>
  <script src="app4.js"></script>
  <script src="app5.js"></script>
</body>
</html>
